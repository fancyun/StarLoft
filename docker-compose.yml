services:
  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: kyc_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 本地MySQL数据库（替换原云数据库；首次启动自动执行 database/init.sql 完成建库与初始化）
  mysql:
    image: mysql:8.0
    container_name: kyc_mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      # 本地 root 密码取自 .env 的 DB_PASSWORD（后端容器使用同一密码连接）
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      # 分库库名固定（与 database/init.sql 一致），init.sql 会创建全部库
      MYSQL_DATABASE: starloft_sys
      TZ: Asia/Shanghai
    ports:
      # 仅便于宿主机用数据库客户端直连查看，后端走内部网络不依赖此映射
      - "3306:3306"
    volumes:
      # 数据库数据存放于项目内 ./data/mysql（bind mount，替代具名数据卷）
      - ./data/mysql:/var/lib/mysql
      # 首次初始化（数据目录为空时）自动执行 init.sql；.md 文档会被 MySQL 初始化目录忽略
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p'${DB_PASSWORD}' -N -e 'SELECT COUNT(*) FROM starloft_sys.platform_user LIMIT 1;'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # 后端服务（不暴露端口，仅内部访问）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kyc_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      # 服务器配置
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      GIN_MODE: ${GIN_MODE:-release}
      
      # 本地数据库配置（本机 MySQL 容器；分库：系统库 + 实名认证产品库）
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-50}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-200}
      
      # Redis配置（使用本地Redis容器）
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-10}
      
      # JWT配置
      JWT_SECRET: ${JWT_SECRET}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      
      # 加密配置
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      
      # FinAuth实名认证配置
      FINAUTH_API_KEY: ${FINAUTH_API_KEY}
      FINAUTH_API_SECRET: ${FINAUTH_API_SECRET}
      FINAUTH_SCENE_ID: ${FINAUTH_SCENE_ID:-kyc}
      FINAUTH_BASE_URL: ${FINAUTH_BASE_URL:-https://api.yljz.com}
      
      # 腾讯云配置
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY}
      TENCENT_SMS_SIGN_NAME: ${TENCENT_SMS_SIGN_NAME:-星楼网络}
      TENCENT_SMS_SDK_APP_ID: ${TENCENT_SMS_SDK_APP_ID}
      TENCENT_SMS_TEMPLATE_ID: ${TENCENT_SMS_TEMPLATE_ID}
      TENCENT_CAPTCHA_APP_ID: ${TENCENT_CAPTCHA_APP_ID:-197971702}
      TENCENT_CAPTCHA_SECRET: ${TENCENT_CAPTCHA_SECRET}
      
      # 支付宝支付配置（电脑网站支付）
      ALIPAY_APP_ID: ${ALIPAY_APP_ID}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY}
      
      # 微信支付配置（Native支付）
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY}
      WECHAT_MCH_SERIAL_NO: ${WECHAT_MCH_SERIAL_NO}
      WECHAT_MCH_PRIVATE_KEY: ${WECHAT_MCH_PRIVATE_KEY}
      WECHAT_PLATFORM_PUBLIC_KEY: ${WECHAT_PLATFORM_PUBLIC_KEY}
      
      # 邮件服务（腾讯云 SES，用于发送邮箱验证码）
      SES_FROM: ${SES_FROM:-}
      SES_TEMPLATE_ID: ${SES_TEMPLATE_ID:-}
      SES_REGION: ${SES_REGION:-ap-guangzhou}
      
      # 日志目录（挂载宿主项目 ./logs）
      LOG_DIR: /app/logs
      
      # 时区
      TZ: Asia/Shanghai
    volumes:
      # 日志存放于项目内 ./logs（bind mount，替代具名数据卷）
      - ./logs:/app/logs
    # 不暴露端口到宿主机，仅内部网络访问
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/console/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端服务（Nginx 多站点：www.starloft.cn 门户 + console.starloft.cn 控制台 + admin.starloft.cn 管理后台 + 反向代理）
  # 镜像内一次构建三个前端应用，通过不同 server 块按域名分发
  frontend:
    build:
      context: .
      dockerfile: frontend-console/Dockerfile
      shm_size: '2gb'  # 增加共享内存
    container_name: kyc_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      # 证书目录：www.starloft.cn/、console.starloft.cn/、admin.starloft.cn/ 子目录各含 fullchain.pem + privkey.pem，
      # 证书由服务商（腾讯云）自动续费，到期后替换对应子目录文件并重启前端生效
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

# 数据卷
volumes:
  redis_data:
    driver: local
