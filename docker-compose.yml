services:
  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: kyc_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - kyc_network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 后端服务（不暴露端口，仅内部访问）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kyc_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # 服务器配置
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      GIN_MODE: ${GIN_MODE:-release}
      
      # 云数据库配置
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-kyc_platform}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-50}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-200}
      
      # Redis配置（使用本地Redis容器）
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-10}
      
      # JWT配置
      JWT_SECRET: ${JWT_SECRET}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      
      # 加密配置
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      
      # FinAuth实名认证配置
      FINAUTH_API_KEY: ${FINAUTH_API_KEY}
      FINAUTH_API_SECRET: ${FINAUTH_API_SECRET}
      FINAUTH_SCENE_ID: ${FINAUTH_SCENE_ID:-kyc}
      FINAUTH_BASE_URL: ${FINAUTH_BASE_URL:-https://api.yljz.com}
      FINAUTH_RETURN_URL: ${FINAUTH_RETURN_URL:-https://kyc.starloft.cn/user/kyc}
      FINAUTH_NOTIFY_URL: ${FINAUTH_NOTIFY_URL:-https://kyc.starloft.cn/api/v1/callback/finauth}
      
      # 腾讯云配置
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY}
      TENCENT_SMS_SIGN_NAME: ${TENCENT_SMS_SIGN_NAME:-星楼网络}
      TENCENT_SMS_SDK_APP_ID: ${TENCENT_SMS_SDK_APP_ID}
      TENCENT_SMS_TEMPLATE_ID: ${TENCENT_SMS_TEMPLATE_ID}
      TENCENT_CAPTCHA_APP_ID: ${TENCENT_CAPTCHA_APP_ID:-197971702}
      TENCENT_CAPTCHA_SECRET: ${TENCENT_CAPTCHA_SECRET}
      
      # 银联支付配置
      UNIONPAY_MERCHANT_NO: ${UNIONPAY_MERCHANT_NO}
      UNIONPAY_TERMINAL_NO: ${UNIONPAY_TERMINAL_NO}
      UNIONPAY_ACCESS_TOKEN: ${UNIONPAY_ACCESS_TOKEN}
      UNIONPAY_SIGN_KEY: ${UNIONPAY_SIGN_KEY}
      UNIONPAY_API_URL: ${UNIONPAY_API_URL:-https://qr.chinaums.com}
      UNIONPAY_NOTIFY_URL: ${UNIONPAY_NOTIFY_URL:-https://kyc.starloft.cn/api/v1/callback/payment}
      
      # 邮件服务（SMTP，用于发送邮箱验证码）
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      
      # 日志目录（映射到 backend_logs 数据卷）
      LOG_DIR: /app/logs
      
      # 时区
      TZ: Asia/Shanghai
    volumes:
      - backend_logs:/app/logs
    # 不暴露端口到宿主机，仅内部网络访问
    expose:
      - "8080"
    networks:
      - kyc_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/public/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端服务（Nginx + 反向代理）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      shm_size: '2gb'  # 增加共享内存
    container_name: kyc_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    networks:
      - kyc_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

# 数据卷
volumes:
  redis_data:
    driver: local
  backend_logs:
    driver: local

# 网络
networks:
  kyc_network:
    driver: bridge
